<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyst Authentication — PhishGuard AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M12 2L3 6v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6l-9-4z'/></svg>" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2.2" />
  <script src="theme.js?v=2.2"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
    }
    .auth-card {
      padding: 36px 32px;
      border-radius: 20px;
      background: rgba(10, 16, 30, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 25px rgba(56, 189, 248, 0.1);
      transition: all 0.3s ease;
    }
    [data-theme="light"] .auth-card {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(15, 23, 42, 0.1);
      box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.12);
    }
    .switch-mode {
      text-align: center;
      margin-top: 20px;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .switch-mode a {
      color: var(--cyan);
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .switch-mode a:hover {
      text-decoration: underline;
    }
    .top-nav-bar {
      position: fixed;
      top: 20px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }
    .back-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 600;
      background: rgba(10, 16, 30, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 16px;
      border-radius: 999px;
      transition: all 0.2s ease;
    }
    .back-home-btn:hover {
      color: #fff;
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.08);
    }
    [data-theme="light"] .back-home-btn {
      background: rgba(255, 255, 255, 0.85);
      border-color: rgba(15, 23, 42, 0.1);
      color: #475569;
    }
    [data-theme="light"] .back-home-btn:hover {
      background: rgba(2, 132, 199, 0.08);
      color: #0284c7;
      border-color: rgba(2, 132, 199, 0.3);
    }
    @media (max-width: 480px) {
      .auth-card {
        padding: 24px 18px;
        border-radius: 16px;
      }
      .top-nav-bar {
        top: 12px;
        left: 14px;
        right: 14px;
      }
      .back-home-btn {
        padding: 6px 12px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <!-- AMBIENT AURORA LIGHT MESH -->
  <div class="ambient-aurora">
    <div class="aurora-beam aurora-1"></div>
    <div class="aurora-beam aurora-2"></div>
  </div>

  <!-- TOP UTILITY BAR -->
  <div class="top-nav-bar">
    <a href="index.html" class="back-home-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Platform</span>
    </a>

    <!-- Unified Theme Toggle Button -->
    <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Color Theme" title="Toggle Theme">
      <svg class="theme-icon moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <svg class="theme-icon sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
  </div>

  <div class="auth-container">
    <div class="glass-card auth-card card-inner">
      <!-- Official SVG Shield Brand Emblem -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 24px;">
        <div class="brand-logo-badge" style="width: 44px; height: 44px; border-radius: 12px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L3 6V12C3 17.5 6.8 22.6 12 24C17.2 22.6 21 17.5 21 12V6L12 2Z" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>
            <path d="M12 7L7 9.5V13C7 16.1 9.1 19 12 19.8C14.9 19 17 16.1 17 13V9.5L12 7Z" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="1.2"/>
            <circle cx="12" cy="13" r="2" fill="#fff"/>
          </svg>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 1.35rem; font-weight: 800; color: #fff; letter-spacing: -0.02em;">Phish<span style="color: #38bdf8;">Guard</span></span>
          <span class="brand-tag">AI</span>
        </div>
      </div>

      <h2 id="authTitle" style="text-align: center; font-size: 1.4rem; font-weight: 700; margin-bottom: 6px;">SOC Terminal Access</h2>
      <p id="authDesc" style="text-align: center; color: var(--muted); font-size: 0.88rem; margin-bottom: 24px;">Sign in to unlock multi-engine heuristics and persistent investigation logs.</p>

      <form id="authForm">
        <div class="field">
          <label style="font-weight: 600;">Analyst Username</label>
          <input type="text" id="username" placeholder="e.g. analyst1" required style="border-radius: 10px;" autocomplete="username" />
        </div>
        <div class="field">
          <label style="font-weight: 600;">Security Key / Password</label>
          <input type="password" id="password" placeholder="••••••••••••" required style="border-radius: 10px;" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 14px; padding: 11px; font-weight: 600;" id="authBtn">Authenticate Session</button>
      </form>
      
      <button type="button" class="btn btn-outline" onclick="guestLogin()" style="width: 100%; justify-content: center; margin-top: 10px; padding: 9px; border-color: rgba(255,255,255,0.12); color: var(--muted); font-size: 0.85rem;">
        Continue as Guest Analyst
      </button>

      <div id="errorMsg" style="border-radius: 8px; padding: 11px 14px; font-size: 0.84rem; text-align: center; margin-top: 16px; display: none; line-height: 1.45;"></div>

      <div class="switch-mode" id="switchMode">
        Don't have an account? <a onclick="toggleMode()">Register here</a>
      </div>
    </div>
  </div>

  <script>
    let isLogin = true;

    function guestLogin() {
      localStorage.setItem('token', 'analyst_guest_' + Date.now());
      localStorage.setItem('username', 'Guest Analyst');
      window.location.href = 'index.html';
    }

    function toggleMode() {
      isLogin = !isLogin;
      document.getElementById('authTitle').innerText = isLogin ? 'SOC Terminal Access' : 'Create Analyst Account';
      document.getElementById('authDesc').innerText = isLogin ? 'Sign in to unlock multi-engine heuristics and persistent investigation logs.' : 'Register a new operator identity on this node.';
      document.getElementById('authBtn').innerText = isLogin ? 'Authenticate Session' : 'Create Identity';
      document.getElementById('switchMode').innerHTML = isLogin 
        ? `Don't have an account? <a onclick="toggleMode()">Register here</a>` 
        : `Already registered? <a onclick="toggleMode()">Log in here</a>`;
      const msg = document.getElementById('errorMsg');
      msg.style.display = 'none';
    }

    // Client-side account persistence helper
    function getStoredUsers() {
      try {
        return JSON.parse(localStorage.getItem('phishguard_registered_users') || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveStoredUsers(users) {
      localStorage.setItem('phishguard_registered_users', JSON.stringify(users));
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const submitBtn = document.getElementById('authBtn');

      if (!u || !p) {
        showFeedback('Please provide both username and security key.', 'error');
        return;
      }

      if (!isLogin && p.length < 4) {
        showFeedback('Security key must be at least 4 characters long.', 'error');
        return;
      }

      submitBtn.disabled = true;
      const originalBtnText = submitBtn.innerText;
      submitBtn.innerText = isLogin ? 'Verifying...' : 'Registering...';

      const path = isLogin ? '/api/auth/login' : '/api/auth/register';
      const isStaticEnv = window.location.protocol === 'file:' || window.location.hostname.includes('github.io');
      
      // Auto-detect backend if running locally
      const API_BASE = (!isStaticEnv && window.location.port && window.location.port !== '3000') 
        ? 'http://localhost:3000' 
        : '';
      const endpoint = API_BASE + path;

      // 1. Try real Python Flask backend if not on pure static hosting
      if (!isStaticEnv) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 1800);
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p }),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          const contentType = res.headers.get('content-type') || '';
          if (contentType.includes('application/json')) {
            const data = await res.json();
            if (res.ok && data) {
              if (isLogin) {
                localStorage.setItem('token', data.token || ('token_' + Date.now()));
                const loggedUser = (data.user && data.user.username) ? data.user.username : (data.username || u);
                localStorage.setItem('username', loggedUser);
                window.location.href = 'index.html';
                return;
              } else {
                showFeedback('Account registered with backend! Redirecting to login...', 'success');
                setTimeout(() => {
                  toggleMode();
                  document.getElementById('username').value = u;
                  submitBtn.disabled = false;
                  submitBtn.innerText = 'Authenticate Session';
                }, 700);
                return;
              }
            } else if (!res.ok && data && data.error) {
              submitBtn.disabled = false;
              submitBtn.innerText = originalBtnText;
              showFeedback(data.error, 'error');
              return;
            }
          }
        } catch (fetchErr) {
          // Backend offline or unreachable; fall through to dual-mode persistence
        }
      }

      // 2. Resilient Dual-Mode Handler (GitHub Pages & Offline Node)
      const users = getStoredUsers();

      if (!isLogin) {
        // REGISTRATION MODE
        if (users[u.toLowerCase()]) {
          submitBtn.disabled = false;
          submitBtn.innerText = originalBtnText;
          showFeedback('Analyst username already registered on this node. Please log in.', 'error');
          return;
        }

        // Store new analyst credentials locally
        users[u.toLowerCase()] = {
          username: u,
          password: p,
          registeredAt: new Date().toISOString()
        };
        saveStoredUsers(users);

        showFeedback('Analyst identity successfully created! Authenticating...', 'success');
        localStorage.setItem('token', 'phishguard_live_' + Date.now());
        localStorage.setItem('username', u);

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);

      } else {
        // LOGIN MODE
        const existing = users[u.toLowerCase()];
        if (existing) {
          if (existing.password !== p) {
            submitBtn.disabled = false;
            submitBtn.innerText = originalBtnText;
            showFeedback('Invalid security key. Please check your password.', 'error');
            return;
          }
        }

        // Successful authentication
        localStorage.setItem('token', 'phishguard_live_' + Date.now());
        localStorage.setItem('username', existing ? existing.username : u);
        showFeedback('Identity confirmed. Initializing SOC terminal...', 'success');

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 400);
      }
    });

    function showFeedback(msg, type) {
      const box = document.getElementById('errorMsg');
      box.style.display = 'block';
      if (type === 'success') {
        box.style.color = '#10b981';
        box.style.background = 'rgba(16, 185, 129, 0.12)';
        box.style.border = '1px solid rgba(16, 185, 129, 0.3)';
      } else {
        box.style.color = '#ef4444';
        box.style.background = 'rgba(239, 68, 68, 0.12)';
        box.style.border = '1px solid rgba(239, 68, 68, 0.3)';
      }
      box.innerText = msg;
    }
  </script>
</body>
</html>
