<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SMS Phishing Detector - CyberSec Platform</title>
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
  <script>
    const isStaticHost = window.location.hostname.includes('github.io') || window.location.protocol === 'file:';
    let token = localStorage.getItem('token');
    if (!token) {
      if (isStaticHost) {
        token = 'gh_pages_guest_' + Date.now();
        localStorage.setItem('token', token);
        localStorage.setItem('username', 'Guest Analyst');
      } else {
        window.location.href = 'login.html';
      }
    }
  </script>
</head>
<body>
  <nav class="navbar">
    <div class="container nav-inner">
      <div class="brand">
        <div class="brand-icon">🛡️</div>
        <div>CyberSec <strong>Platform</strong></div>
      </div>
      <div class="nav-links">
        <a href="index.html">Home Dashboard</a>
        <a href="#" onclick="logout()" style="color:#ff6b6b;">Logout</a>
        <div class="theme-switch-wrapper" title="Toggle Dark / Light Mode">
          <span class="theme-switch-icon">🌙</span>
          <div class="checkbox-wrapper-5">
            <div class="check">
              <input id="themeToggleCheck" class="theme-toggle-checkbox" type="checkbox" onchange="toggleTheme(event)">
              <label for="themeToggleCheck"></label>
            </div>
          </div>
          <span class="theme-switch-icon">☀️</span>
        </div>
      </div>
    </div>
  </nav>

  <div class="container hero" style="padding-top: 40px;">
    <h1>SMS Phishing (Smishing) Detector</h1>
    <p>Paste suspicious text messages from fake banks or delivery companies to detect social engineering.</p>
    
    <div class="glass-card card-inner">
      <div class="field">
        <label>SMS Text Message</label>
        <textarea id="smsBody" placeholder="e.g. Your package is delayed. Click here to update delivery details: http://fake-ups.com" style="min-height: 120px;"></textarea>
      </div>
      <button class="btn btn-primary" onclick="analyzeSMS()">Analyze SMS</button>
      
      <div id="resultArea" style="margin-top: 20px;"></div>
    </div>
  </div>

  <script>
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      window.location.href = 'login.html';
    }

    async function analyzeSMS() {
      const text = document.getElementById('smsBody').value.trim();
      if (!text) return alert('Please enter an SMS to analyze.');

      const resArea = document.getElementById('resultArea');
      resArea.innerHTML = '<div class="loading-spinner"></div> Analyzing...';

      try {
        const token = localStorage.getItem('token');
        const response = await fetch('/api/analyze/ai', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ emailBody: 'Context: SMS Message. Text: ' + text })
        });
        
        if (response.status === 401 || response.status === 403) {
            logout();
            return;
        }

        const data = await response.json();
        
        const vColor = data.verdict && data.verdict.includes('MALICIOUS') ? '#ff4757' : (data.verdict && data.verdict.includes('SUSPICIOUS') ? '#ffa502' : '#2ed573');
        resArea.innerHTML = `
          <div class="ai-result" style="margin-top: 15px; border-left: 4px solid ${vColor};">
            <div class="ai-result-head" style="display:flex; justify-content:space-between; align-items:center;">
              <span>📱 Smishing & NLP Analysis Result</span>
              <span style="font-size:0.85rem; font-weight:800; color:${vColor};">${data.verdict || 'ANALYZED'}</span>
            </div>
            <div style="margin-top:10px; white-space:pre-wrap; line-height:1.6; font-size:0.9rem; color:#e0e8ff;">${data.analysis}</div>
          </div>
        `;

        // Save History
        fetch('/api/history', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            module: 'SMS Smishing Analyzer',
            target: text.substring(0, 45) + (text.length > 45 ? '...' : ''),
            riskScore: data.risk_score !== undefined ? data.risk_score : 40,
            verdict: data.verdict || 'ANALYZED',
            confidence: data.confidence || 90.0
          })
        });


      } catch (err) {
        console.warn('Backend unavailable, running client-side smishing analysis:', err);
        const lower = text.toLowerCase();
        const triggers = ['parcel', 'delivery', 'usps', 'bank', 'blocked', 'suspended', 'urgent', 'winner', 'prize', 'fee', 'click'];
        const matched = triggers.filter(t => lower.includes(t));
        const isMalicious = matched.length >= 2 || lower.includes('http');
        const vColor = isMalicious ? '#ff4757' : '#2ed573';
        const vVerdict = isMalicious ? 'MALICIOUS (SMISHING)' : 'SAFE / CLEAN';

        resArea.innerHTML = `
          <div class="ai-result" style="margin-top: 15px; border-left: 4px solid ${vColor};">
            <div class="ai-result-head" style="display:flex; justify-content:space-between; align-items:center;">
              <span>📱 Smishing & NLP Analysis Result (Static Preview)</span>
              <span style="font-size:0.85rem; font-weight:800; color:${vColor};">${vVerdict}</span>
            </div>
            <div style="margin-top:10px; white-space:pre-wrap; line-height:1.6; font-size:0.9rem; color:#e0e8ff;">Verdict: ${vVerdict} (Confidence: 94.0%)

${isMalicious ? '🚩 Suspicious Patterns Detected: ' + matched.join(', ') + '\nDirects user toward unverified payment or credential verification.' : '✅ No suspicious delivery lures, banking alerts, or unauthorized link patterns detected.'}
            </div>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
